<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf5f8"><title>朱逸凡精选项目</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf5f8;color:#4e687b;font-family:"Microsoft YaHei",sans-serif}.stage{height:100svh;min-height:500px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#fff 0%,#edf7fa 45%,#cce5ef 100%)}.stage:after{content:"";position:absolute;left:8%;right:8%;bottom:14%;height:1px;background:linear-gradient(90deg,transparent,#9fbfce,transparent)}.copy{text-align:center;z-index:1;padding:24px}.copy h1{font-family:SimSun,"Songti SC",serif;font-size:clamp(34px,7vw,108px);font-weight:500;letter-spacing:.12em;margin:0 0 36px;opacity:0;animation:reveal 1.4s 4.4s forwards}.copy a{display:inline-flex;align-items:center;gap:22px;color:#167c9b;font-size:clamp(14px,1.3vw,19px);letter-spacing:.2em;text-decoration:none;border-bottom:1px solid #167c9b;padding:14px 6px;opacity:0;animation:reveal 1s 5.2s forwards}.copy a:hover{color:#11627c}.copy a:focus-visible{outline:2px solid #167c9b;outline-offset:8px}.traveler{position:absolute;z-index:2;bottom:14%;left:0;width:clamp(180px,25vw,340px);aspect-ratio:1/2;transform:translateX(-110%);animation:cross 5.4s .2s linear forwards;pointer-events:none}.sprite{width:100%;height:100%;background:url('./media/intro-walk.png') 0 0/600% 100%;animation:walk .9s steps(6) infinite;filter:drop-shadow(0 14px 12px #42677e20)}.caption{position:absolute;bottom:5%;font-size:10px;letter-spacing:.35em;color:#5c7485}.skip{position:absolute;right:5%;top:5%;border:0;background:none;color:#5c7485;cursor:pointer;padding:12px;font:inherit;font-size:12px}.done .traveler{display:none}.done h1,.done a{animation:none;opacity:1}@keyframes walk{to{background-position:120% 0}}@keyframes cross{to{transform:translateX(calc(100vw + 100%))}}@keyframes reveal{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@media(prefers-reduced-motion:reduce){.traveler{display:none}.copy h1,.copy a{animation:none;opacity:1}}@media(max-width:600
